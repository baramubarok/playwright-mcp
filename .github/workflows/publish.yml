name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]*'  # Match tags like v0.2.2

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
      
      - name: Build
        run: npm run build
        timeout-minutes: 5
      
      - name: Publish to NPM (staging)
        run: npm publish --provenance --tag staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        timeout-minutes: 5
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ✅ Package staged to NPM Registry
            
            📦 **To promote to latest (requires 2FA):**
            ```bash
            npm dist-tag add playwright-generate-mcp@${{ github.ref_name }} latest
            npm dist-tag rm playwright-generate-mcp staging
            ```
          draft: false
          prerelease: false
