name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Stage publish to NPM
        run: npm publish --provenance --tag staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ✅ Package staged on NPM
            
            📦 Package: https://www.npmjs.com/package/playwright-generate-mcp
            
            ⚠️ **IMPORTANT**: This version has been staged and requires manual promotion with 2FA.
            
            To publish this version:
            ```bash
            npm dist-tag add playwright-generate-mcp@${{ github.ref_name }} latest
            npm dist-tag rm playwright-generate-mcp staging
            ```
            
            Or use: `npm view playwright-generate-mcp` to verify staging
          draft: false
          prerelease: false
