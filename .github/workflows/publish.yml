name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]*'  # Match tags like v0.2.2

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # For creating releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
      
      - name: Build
        run: npm run build
        timeout-minutes: 5
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📦 Release ${{ github.ref_name }}
            
            ✅ **Build:** Passed
            ✅ **Tests:** Validated
            
            ---
            
            ### 🚀 To Publish to NPM
            
            Run locally (requires 2FA):
            ```bash
            npm publish --provenance --tag staging
            npm dist-tag add playwright-generate-mcp@${{ github.ref_name }} latest
            npm dist-tag rm playwright-generate-mcp staging
            ```
          draft: false
          prerelease: false
