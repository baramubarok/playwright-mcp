name: CI - Test & Validate

on:
  push:
    branches: [main, develop]
    tags-ignore:
      - 'v*'  # Don't run on version tags
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
      
      - name: Build
        run: npm run build
        timeout-minutes: 5
      
      - name: Run unit tests
        run: |
          find test/unit -name "*.test.ts" -type f | while read file; do
            node --import tsx --test --test-timeout=60000 "$file"
          done
        timeout-minutes: 5
      
      - name: Validate package
        run: npm run check:package
        timeout-minutes: 2
